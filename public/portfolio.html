<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — En construcción</title>
  <style>
    :root {
      --bg: #0D1117;
      --text: #C9D1D9;
      --amber: #FFB000;
      --muted: #8b949e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      padding: 2rem;
      text-align: center;
    }
    .gif {
      width: 220px;
      border-radius: 12px;
      border: 1px solid rgba(255, 176, 0, 0.35);
      box-shadow: 0 0 40px rgba(255, 176, 0, 0.25);
    }
    h1 {
      color: var(--amber);
      font-size: 1.5rem;
      letter-spacing: 0.05em;
    }
    p { color: var(--muted); font-size: 0.9rem; }
    a {
      color: var(--amber);
      text-decoration: none;
      font-size: 0.85rem;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <img class="gif" src="/under-construction.gif" alt="En construcción" />
  <h1>➜ En construcción</h1>
  <p>El portfolio está en camino.</p>
  <a href="/">← volver</a>
</body>
</html>
